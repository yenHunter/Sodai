; Supervisor program for Sodai's queue worker.
;
; Install on the production host:
;   sudo cp deploy/supervisor/sodai-queue-worker.conf /etc/supervisor/conf.d/sodai-queue-worker.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start sodai-queue-worker:*
;
; Update `directory`, `command`, and `user` for the deployment. The worker
; recycles hourly (`--max-time`) so long-running processes pick up code and
; config changes after a release.

[program:sodai-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/sodai/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/sodai
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/sodai/queue-worker.log
stopwaitsecs=3600
